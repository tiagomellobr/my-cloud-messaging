services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloud_messaging}
      POSTGRES_USER: ${POSTGRES_USER:-mcm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcm} -d ${POSTGRES_DB:-cloud_messaging}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mcm}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-cloud_messaging}
      API_KEY: ${API_KEY:?API_KEY is required}
      HOST: "${HOST:-0.0.0.0}"
      PORT: "${PORT:-8080}"
      VAPID_CONTACT: ${VAPID_CONTACT:-mailto:admin@example.com}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      CLEANUP_INTERVAL_HOURS: ${CLEANUP_INTERVAL_HOURS:-6}
      NOTIFICATION_TTL_SECONDS: ${NOTIFICATION_TTL_SECONDS:-86400}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://${HOST:-0.0.0.0}:${PORT:-8080}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
